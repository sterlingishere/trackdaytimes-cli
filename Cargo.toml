[package]
name = "trackdaytimes-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read TrackDayTimes lap times, results and rankings for UAE circuits from your terminal."
license = "MIT"
repository = "https://github.com/sterlingishere/trackdaytimes-cli"
homepage = "https://trackdaytimes.com"
readme = "README.md"
keywords = ["motorsport", "lap-times", "track-day", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "tdt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
rpassword = "7.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = "3.4.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
